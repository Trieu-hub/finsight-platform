server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast instead of blocking a login thread indefinitely when Redis is unreachable.
      timeout: 2s
      connect-timeout: 2s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  # Metrics are exported by Prometheus scrape (/actuator/prometheus). Turn OFF the OTLP
  # metrics push registry: nothing consumes OTLP metrics (Tempo receives traces only), so it
  # only logged "Connection refused localhost:4318" every step. Tracing OTLP is separate
  # (management.opentelemetry.tracing, still gated by TRACING_SAMPLING_PROBABILITY).
  otlp:
    metrics:
      export:
        enabled: false
  # Distributed tracing → OTLP → Tempo. Off by default (sampling 0); enable with
  # TRACING_SAMPLING_PROBABILITY=1.0 and the monitoring profile. The endpoint is the full
  # OTLP traces signal URL (…/v1/traces), overridden to the Tempo container in docker-compose.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  metrics:
    distribution:
      # Publish latency histogram buckets so Grafana can compute p95/p99 with
      # histogram_quantile(); without buckets only averages are possible.
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      show-components: never
      # Expose /actuator/health/liveness and /actuator/health/readiness (not
      # Kubernetes-specific; this is Spring Boot's generic probe support).
      probes:
        enabled: true
      group:
        # Liveness = "process is healthy"; must NOT depend on external infra,
        # otherwise a DB/Redis blip would cause needless restarts.
        liveness:
          include: livenessState
        # Readiness = "can serve traffic"; DOWN until DB and Redis are reachable
        # so an orchestrator stops sending requests this node cannot serve.
        readiness:
          include: readinessState,db,redis
    info:
      enabled: true
  info:
    env:
      enabled: false
  health:
    redis:
      # Redis backs refresh-token issuance; surface its outage in readiness so an
      # orchestrator stops routing login traffic to a node that cannot issue tokens.
      enabled: true

jwt:
  # RSA keys (base64 DER, PEM armor optional), no defaults. auth-service alone holds the
  # private key and is the only component that can mint tokens; the public key is shared
  # with every validator so they can verify but never forge.
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  # Keys that no longer sign but must still verify, for the overlap window of a rotation:
  # tokens minted by the outgoing key stay valid until they expire, so rotating does not log
  # everyone out. Empty in steady state; set only while rotating, then cleared.
  # Comma-separated (base64 contains no comma). See scripts/rotate-jwt-key.sh.
  previous-public-keys: ${JWT_PREVIOUS_PUBLIC_KEYS:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  # Emitted into issued tokens and logged on validation, but NOT enforced yet.
  issuer: ${JWT_ISSUER:finsight-auth}
  audience: ${JWT_AUDIENCE:finsight-api}

security:
  login:
    # Per-account brute-force guard (LoginAttemptService). Edge/IP throttling is
    # intentionally left to the future API Gateway, not duplicated here.
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    attempt-window: ${LOGIN_ATTEMPT_WINDOW:15m}
    lock-duration: ${LOGIN_LOCK_DURATION:15m}

