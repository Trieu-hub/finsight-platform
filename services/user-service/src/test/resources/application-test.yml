# Test profile. The datasource is injected dynamically from the MySQL Testcontainer
# (see AbstractMySqlIntegrationTest), so only non-datasource settings live here.
spring:
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it against the entities.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

  # Bind the gRPC server to a random free port in tests: every booted context starts one
  # (a BindableService bean is present), so a fixed port would clash across cached contexts.
  # The gRPC integration test drives the service over an in-process server instead.
  grpc:
    server:
      port: 0

# RS256 verification key for JwtService in tests.
# The RS256 public key is injected per test via @DynamicPropertySource
# (AbstractMySqlIntegrationTest -> JwtTestTokens.publicKeyBase64()).
jwt:
  # Enforced on validation; integration test tokens must carry these.
  issuer: finsight-auth
  audience: finsight-api
