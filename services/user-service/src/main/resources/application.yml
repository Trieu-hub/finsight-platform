server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # MySQL8Dialect was removed in Hibernate 7; MySQLDialect auto-detects 8.x.
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true

  # gRPC server hosting the internal UserProfileService (the platform's one gRPC
  # internal-sync endpoint, called by the dashboard BFF). Bound to a dedicated port,
  # kept OFF the public network — never published to the host, reachable only over the
  # Docker network by service name, same posture as the internal risk-service.
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9092}

management:
  # Distributed tracing → OTLP → Tempo. Off by default (sampling 0); enable with
  # TRACING_SAMPLING_PROBABILITY=1.0 and the monitoring profile. The endpoint is the full
  # OTLP traces signal URL (…/v1/traces), overridden to the Tempo container in docker-compose.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  metrics:
    distribution:
      # Publish latency histogram buckets so Grafana can compute p95/p99 with
      # histogram_quantile(); without buckets only averages are possible.
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      show-components: never
      # Expose /actuator/health/liveness and /actuator/health/readiness (generic
      # Spring Boot probe support, not Kubernetes-specific).
      probes:
        enabled: true
      group:
        # Liveness must not depend on the DB (a DB blip should not restart us).
        liveness:
          include: livenessState
        # Readiness is DOWN until the database is reachable.
        readiness:
          include: readinessState,db
    info:
      enabled: true
  info:
    env:
      enabled: false

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  # Enforced on validation (parity with the gateway and the minting auth-service).
  issuer: ${JWT_ISSUER:finsight-auth}
  audience: ${JWT_AUDIENCE:finsight-api}
