server:
  port: 8085

spring:
  application:
    name: dashboard-service

# Read-only aggregation layer (BFF). Owns NO database. It calls the Transaction and
# Budget services over REST and the User service over gRPC, relaying the caller's JWT so
# each upstream authorizes as the same user (see docs/ADR-0003).
dashboard:
  services:
    transaction-uri: ${TRANSACTION_SERVICE_URI:http://localhost:8083}
    budget-uri: ${BUDGET_SERVICE_URI:http://localhost:8084}
  timeouts:
    connect-ms: ${DASHBOARD_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${DASHBOARD_READ_TIMEOUT_MS:5000}
  # Circuit breaker + retry (Resilience4j) around the upstream fan-out — one breaker/retry per
  # upstream service. Defaults are code-side (DashboardProperties.Resilience); override here or
  # via env if a deployment needs different sensitivity.
  resilience:
    failure-rate-threshold: ${DASHBOARD_CB_FAILURE_RATE:50}
    sliding-window-size: ${DASHBOARD_CB_WINDOW:10}
    minimum-number-of-calls: ${DASHBOARD_CB_MIN_CALLS:5}
    wait-duration-in-open-state: ${DASHBOARD_CB_OPEN_WAIT:10s}
    permitted-calls-in-half-open-state: ${DASHBOARD_CB_HALF_OPEN_CALLS:3}
    max-attempts: ${DASHBOARD_RETRY_MAX_ATTEMPTS:2}
    retry-wait-duration: ${DASHBOARD_RETRY_WAIT:200ms}

# gRPC client channel for user-service's internal UserProfileService. Plaintext on the
# private network (no TLS between internal services); the deadline is applied per call
# by UserClient (from dashboard.timeouts.read-ms). Connects lazily on first call.
spring.grpc.client.channels:
  user-service:
    address: ${USER_SERVICE_GRPC_TARGET:static://localhost:9092}
    negotiation-type: plaintext

management:
  # Distributed tracing → OTLP → Tempo. Off by default (sampling 0); enable with
  # TRACING_SAMPLING_PROBABILITY=1.0 and the monitoring profile. The endpoint is the full
  # OTLP traces signal URL (…/v1/traces), overridden to the Tempo container in docker-compose.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  metrics:
    distribution:
      # Publish latency histogram buckets so Grafana can compute p95/p99 with
      # histogram_quantile(); without buckets only averages are possible.
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      show-components: never
      # Expose /actuator/health/liveness and /actuator/health/readiness (generic
      # Spring Boot probe support, not Kubernetes-specific). The BFF owns no
      # datastore; readiness uses the default readinessState and is intentionally
      # decoupled from upstream service health (request-time fail-fast handles that).
      probes:
        enabled: true
    info:
      enabled: true
  info:
    env:
      enabled: false

# auth-service's RSA public key; validated locally on every request (no call to auth).
jwt:
  public-key: ${JWT_PUBLIC_KEY}
  # Enforced on validation (parity with the gateway and the minting auth-service).
  issuer: ${JWT_ISSUER:finsight-auth}
  audience: ${JWT_AUDIENCE:finsight-api}
