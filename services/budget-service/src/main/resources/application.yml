server:
  port: 8084

spring:
  application:
    name: budget-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/budget_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # MySQL8Dialect was removed in Hibernate 7; MySQLDialect auto-detects 8.x.
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # One consumer group for the service; offsets track what budgets have absorbed.
      group-id: budget-service
      # First deploy starts from the beginning of the topic, not only new events.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrap the JSON deserializer so a malformed payload becomes a handled error
      # (DefaultErrorHandler: retry, then log-and-skip) instead of an infinite
      # redelivery loop pinning the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # The producer deliberately omits Java type headers (language-neutral wire
        # format), so the target type must be declared here.
        spring.json.value.default.type: com.pm.budgetservice.event.TransactionCreatedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.pm.budgetservice.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Durability: wait for all in-sync replicas (no-op at RF=1, correct as we scale).
      acks: all
      properties:
        # Keep the payload language-neutral — consumers deserialize by the documented schema.
        spring.json.add.type.headers: false
        # The publish runs AFTER_COMMIT on the request thread; bound the metadata wait so a
        # broker blip fails fast (logged, not rethrown) rather than stalling the request.
        max.block.ms: 10000

finsight:
  kafka:
    # Master switch for event consumption AND publishing (mirrors transaction-service).
    # Off => no listener container starts and the AFTER_COMMIT publisher is skipped.
    enabled: true
    topics:
      # Consumed: the three transaction-lifecycle topics owned by transaction-service.
      transaction-created: finsight.transactions.created
      transaction-updated: finsight.transactions.updated
      transaction-deleted: finsight.transactions.deleted
      # Produced: owned by this service (Phase E.2), consumed by risk-service.
      budget-changed: finsight.budgets.changed

management:
  # Distributed tracing → OTLP → Tempo. Off by default (sampling 0); enable with
  # TRACING_SAMPLING_PROBABILITY=1.0 and the monitoring profile. The endpoint is the full
  # OTLP traces signal URL (…/v1/traces), overridden to the Tempo container in docker-compose.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  metrics:
    distribution:
      # Publish latency histogram buckets so Grafana can compute p95/p99 with
      # histogram_quantile(); without buckets only averages are possible.
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      show-components: never
      # Expose /actuator/health/liveness and /actuator/health/readiness (generic
      # Spring Boot probe support, not Kubernetes-specific).
      probes:
        enabled: true
      group:
        # Liveness must not depend on the DB (a DB blip should not restart us).
        liveness:
          include: livenessState
        # Readiness is DOWN until the database is reachable.
        readiness:
          include: readinessState,db
    info:
      enabled: true
  info:
    env:
      enabled: false

jwt:
  # Bootstrap key: used until the first JWK Set fetch succeeds, so this service can still
  # verify tokens if it starts before auth-service is reachable. Once jwks-uri answers, the
  # published set replaces it -- a key retired there is retired here too.
  public-key: ${JWT_PUBLIC_KEY}
  # Where signing keys are discovered, so a rotation needs no restart here. Unset (the
  # default) pins this service to public-key above. Cached, not called per request.
  jwks-uri: ${JWT_JWKS_URI:}
  # Enforced on validation (parity with the gateway and the minting auth-service).
  issuer: ${JWT_ISSUER:finsight-auth}
  audience: ${JWT_AUDIENCE:finsight-api}
