# Test profile. The datasource is injected dynamically from the MySQL Testcontainer
# (see AbstractMySqlIntegrationTest), so only non-datasource settings live here.
spring:
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it against the entities.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

# No broker in the default test context: the listener and its config are gated off.
finsight:
  kafka:
    enabled: false

# Enforced on validation; integration test tokens must carry these. No key here: the RS256
# public key is injected per test once this service grows a Spring-context test.
jwt:
  issuer: finsight-auth
  audience: finsight-api
