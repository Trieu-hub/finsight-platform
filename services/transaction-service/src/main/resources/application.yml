server:
  port: 8083

spring:
  application:
    name: transaction-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/transaction_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # MySQL8Dialect was removed in Hibernate 7; MySQLDialect auto-detects 8.x.
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Durability: wait for all in-sync replicas (no-op at RF=1, correct as we scale).
      acks: all
      properties:
        # Don't stamp the Java class name into headers — keep the payload language-neutral
        # for future (possibly non-JVM) consumers; they deserialize by the documented schema.
        spring.json.add.type.headers: false
        # Bound how long a send() blocks fetching metadata. Since the publish runs
        # AFTER_COMMIT on the request thread, a broker outage must fail fast (logged,
        # not rethrown) rather than stall transaction creation for the 60s default.
        max.block.ms: 10000

finsight:
  kafka:
    # Master switch for event publishing. Off => create() never reaches for a broker.
    enabled: true
    # Topic names this service owns. Externalized so infra/tests can override.
    # Three transaction-lifecycle topics; consumers subscribe to only the ones they need.
    topics:
      transaction-created: finsight.transactions.created
      transaction-updated: finsight.transactions.updated
      transaction-deleted: finsight.transactions.deleted
  # Transactional outbox relay: how often to drain pending events to Kafka, the batch size per
  # tick, and how long to wait for a broker ack before giving up (retried next tick).
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  metrics:
    distribution:
      # Publish latency histogram buckets so Grafana can compute p95/p99 with
      # histogram_quantile(); without buckets only averages are possible.
      percentiles-histogram:
        http.server.requests: true
  # Distributed tracing → OTLP/HTTP → Tempo. Off by default (sampling 0) so a bare run or a
  # prod stack without the monitoring profile exports nothing and stays quiet; set
  # TRACING_SAMPLING_PROBABILITY=1.0 to record. The endpoint is the full OTLP traces signal URL
  # (…/v1/traces, not the base) — localhost for a bare run, overridden to Tempo in docker-compose.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      show-details: never
      show-components: never
      # Expose /actuator/health/liveness and /actuator/health/readiness (generic
      # Spring Boot probe support, not Kubernetes-specific).
      probes:
        enabled: true
      group:
        # Liveness must not depend on the DB (a DB blip should not restart us).
        liveness:
          include: livenessState
        # Readiness is DOWN until the database is reachable.
        readiness:
          include: readinessState,db
    info:
      enabled: true
  info:
    env:
      enabled: false

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  # Enforced on validation (parity with the gateway and the minting auth-service).
  issuer: ${JWT_ISSUER:finsight-auth}
  audience: ${JWT_AUDIENCE:finsight-api}
