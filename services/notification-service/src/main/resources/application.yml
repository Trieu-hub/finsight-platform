server:
  port: 8087

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/notification_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # MySQL8Dialect was removed in Hibernate 7; MySQLDialect auto-detects 8.x.
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # One consumer group for the service; offsets track which RiskDetected events
      # have already been turned into notifications.
      group-id: notification-service
      # First deploy starts from the beginning of the topic, not only new events.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrap the JSON deserializer so a malformed payload becomes a handled error
      # (DefaultErrorHandler: retry, then log-and-skip) instead of an infinite
      # redelivery loop pinning the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # The producer (risk-service) deliberately omits Java type headers (language-neutral
        # wire format), so the target type must be declared here.
        spring.json.value.default.type: com.pm.notificationservice.event.RiskDetectedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.pm.notificationservice.event

finsight:
  kafka:
    # Master switch for event consumption. Off => no listener container starts (used by
    # the default test profile, which has no broker).
    enabled: true
    topics:
      # Consumed: owned by risk-service. notification-service is the first consumer of
      # this topic — it turns each detected risk into a user-facing in-app notification.
      risk-detected: finsight.risk.detected
  narrator:
    ai:
      # Optional LLM-backed narrator on any OpenAI-compatible API (default: Groq free tier).
      # Off by default => the rule-based TemplateNarrator is used and no external call is made.
      # Flip on only with a key set. Swap providers by overriding LLM_BASE_URL + LLM_MODEL.
      enabled: ${FINSIGHT_NARRATOR_AI_ENABLED:false}
      base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:llama-3.1-8b-instant}
      timeout-ms: ${FINSIGHT_NARRATOR_AI_TIMEOUT_MS:6000}
      max-tokens: ${FINSIGHT_NARRATOR_AI_MAX_TOKENS:200}

management:
  # Metrics are exported by Prometheus scrape (/actuator/prometheus). Turn OFF the OTLP
  # metrics push registry: nothing consumes OTLP metrics (Tempo receives traces only), so it
  # only logged "Connection refused localhost:4318" every step. Tracing OTLP is separate
  # (management.opentelemetry.tracing, still gated by TRACING_SAMPLING_PROBABILITY).
  otlp:
    metrics:
      export:
        enabled: false
  # Distributed tracing → OTLP → Tempo. Off by default (sampling 0); enable with
  # TRACING_SAMPLING_PROBABILITY=1.0 and the monitoring profile. The endpoint is the full
  # OTLP traces signal URL (…/v1/traces), overridden to the Tempo container in docker-compose.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  metrics:
    distribution:
      # Publish latency histogram buckets so Grafana can compute p95/p99 with
      # histogram_quantile(); without buckets only averages are possible.
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      show-components: never
      # Expose /actuator/health/liveness and /actuator/health/readiness (generic
      # Spring Boot probe support, not Kubernetes-specific).
      probes:
        enabled: true
      group:
        # Liveness must not depend on the DB (a DB blip should not restart us).
        liveness:
          include: livenessState
        # Readiness is DOWN until the database is reachable.
        readiness:
          include: readinessState,db
    info:
      enabled: true
  info:
    env:
      enabled: false

jwt:
  # Bootstrap key: used until the first JWK Set fetch succeeds, so this service can still
  # verify tokens if it starts before auth-service is reachable. Once jwks-uri answers, the
  # published set replaces it -- a key retired there is retired here too.
  public-key: ${JWT_PUBLIC_KEY}
  # Where signing keys are discovered, so a rotation needs no restart here. Unset (the
  # default) pins this service to public-key above. Cached, not called per request.
  jwks-uri: ${JWT_JWKS_URI:}
  # Enforced on validation (parity with the gateway and the minting auth-service).
  issuer: ${JWT_ISSUER:finsight-auth}
  audience: ${JWT_AUDIENCE:finsight-api}
