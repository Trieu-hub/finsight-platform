server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Same fail-fast budget as auth-service. This one sits on the hot path of every
      # authenticated request, so a hung Redis must surface as a fast error the revocation
      # check can fail open on — never as a stalled request thread.
      timeout: 2s
      connect-timeout: 2s

# Routing-only edge (Phase 1). Targets default to localhost for local runs and are
# overridden to compose service hostnames via env vars in docker-compose.yml.
gateway:
  routes:
    - prefix: /api/v1/auth
      uri: ${AUTH_SERVICE_URI:http://localhost:8081}
    - prefix: /api/v1/users
      uri: ${USER_SERVICE_URI:http://localhost:8082}
    - prefix: /api/v1/transactions
      uri: ${TRANSACTION_SERVICE_URI:http://localhost:8083}
    - prefix: /api/v1/categories
      uri: ${TRANSACTION_SERVICE_URI:http://localhost:8083}
    - prefix: /api/v1/wallets
      uri: ${TRANSACTION_SERVICE_URI:http://localhost:8083}
    # LuckyMe games. In transaction-service because a round settles to a real transaction and
    # must move the wallet balance atomically — no cross-service call, no drift.
    - prefix: /api/v1/game
      uri: ${TRANSACTION_SERVICE_URI:http://localhost:8083}
    - prefix: /api/v1/budgets
      uri: ${BUDGET_SERVICE_URI:http://localhost:8084}
    - prefix: /api/v1/dashboard
      uri: ${DASHBOARD_SERVICE_URI:http://localhost:8085}
    - prefix: /api/v1/notifications
      uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8087}
    - prefix: /api/v1/analytics
      uri: ${ANALYTICS_SERVICE_URI:http://localhost:8088}
  # Routes that bypass edge authentication. Frozen in docs/ADR-0002 §4: the auth entry
  # points that mint/rotate tokens (caller has no access token, or it may be expired).
  # Everything else under /api/v1/** requires a valid token. Matched by exact method+path.
  public-routes:
    - { method: POST, path: /api/v1/auth/register }
    - { method: POST, path: /api/v1/auth/login }
    - { method: POST, path: /api/v1/auth/refresh }
    - { method: POST, path: /api/v1/auth/logout }
  timeouts:
    connect-ms: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${GATEWAY_READ_TIMEOUT_MS:10000}
  # Reject request bodies larger than this at the edge (→ 413) before buffering them.
  # 2 MiB by default — this API is JSON-only, so anything larger is abuse or a mistake.
  limits:
    max-body-bytes: ${GATEWAY_MAX_BODY_BYTES:2097152}

# Edge JWT validation contract (Phase 2). Frozen in docs/ADR-0002 §1-§3. Verifies with
# auth-service's RSA public key; issuer/audience default to the minted values.
jwt:
  # Bootstrap key: used until the first JWK Set fetch succeeds, so the gateway can still
  # verify tokens if it starts before auth-service is reachable. Once jwks-uri answers, the
  # published set replaces this — a key retired there is retired here too.
  public-key: ${JWT_PUBLIC_KEY}
  # Where the signing keys are discovered, so a rotation does not need this service restarted.
  # Unset (the default) pins the gateway to public-key above. Cached, not called per request.
  jwks-uri: ${JWT_JWKS_URI:}
  issuer: ${JWT_ISSUER:finsight-auth}
  audience: ${JWT_AUDIENCE:finsight-api}

management:
  # Metrics are exported by Prometheus scrape (/actuator/prometheus). Turn OFF the OTLP
  # metrics push registry: nothing consumes OTLP metrics (Tempo receives traces only), so it
  # only logged "Connection refused localhost:4318" every step. Tracing OTLP is separate
  # (management.opentelemetry.tracing, still gated by TRACING_SAMPLING_PROBABILITY).
  otlp:
    metrics:
      export:
        enabled: false
  # Distributed tracing → OTLP → Tempo. Off by default (sampling 0); enable with
  # TRACING_SAMPLING_PROBABILITY=1.0 and the monitoring profile. The endpoint is the full
  # OTLP traces signal URL (…/v1/traces), overridden to the Tempo container in docker-compose.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Publish latency histogram buckets so Grafana can compute p95/p99 with
      # histogram_quantile(); without buckets only averages are possible.
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      # Expose /actuator/health/liveness and /actuator/health/readiness (generic
      # Spring Boot probe support, not Kubernetes-specific). The gateway owns no
      # datastore, so the default groups apply: liveness=livenessState,
      # readiness=readinessState — readiness deliberately depends on NO external
      # infra, as required.
      probes:
        enabled: true
  # Gateway readiness must NOT depend on any external datastore. Redis is now on the
  # classpath (revocation denylist), which would otherwise auto-register a health
  # contributor and drag Redis into /actuator/health — so switch it off explicitly.
  # The revocation check fails open, meaning the gateway keeps serving correctly while
  # Redis is down; reporting itself unhealthy would contradict that and pull a working
  # node out of rotation. Redis outages surface via the
  # finsight.gateway.revocation.check.failed counter instead.
  health:
    redis:
      enabled: false
