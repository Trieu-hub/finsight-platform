name: CodeQL

# Static application security testing (SAST) — the gap left by ci.yml (build+test) and
# security.yml (secrets + dependency CVEs): neither of those looks at what the code itself
# does. CodeQL analyses the source for injection, path traversal, unsafe deserialization,
# hardcoded credentials, and the rest of GitHub's default security suite.
#
# Findings land in the repo's Security -> Code scanning tab and are annotated on the PR diff.
# The workflow itself does not fail on an alert (the "Code scanning results" check does that,
# once it is made a required check in branch protection).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC — new CodeQL queries ship faster than this repo changes

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF results to the Security tab
      contents: read
      actions: read

    strategy:
      fail-fast: false # one language failing must not hide the other's results
      matrix:
        include:
          # build-mode: none analyses the sources without compiling them. This repo has no
          # aggregator pom — nine standalone Maven projects — so a build-based extraction would
          # mean nine `mvn package` runs on every PR. The trade-off is slightly weaker dataflow
          # through third-party jars; switch to `manual` with an explicit build step if a rule
          # ever needs the full classpath.
          - language: java-kotlin
            build-mode: none
          # The React/Vite SPA in web/. JS/TS never needs a build for extraction.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `queries:` override — the default suite is what GitHub's own default setup runs:
      # high-precision security rules, so an alert here is worth triaging rather than muting.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
