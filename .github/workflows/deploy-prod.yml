name: Deploy to production

# Manual, gated deploy to the single prod VPS. This does NOT auto-deploy on merge: vernfy.com
# is a live site, so a human clicks "Run workflow" (and, if the `production` Environment has
# required reviewers configured, a second human approves) before anything ships.
#
# How it works: CI already builds and tests every service on main. This workflow simply SSHes
# into the VPS and runs the box's OWN deploy path — `git reset --hard` to the chosen ref, then
# `scripts/prod-compose.sh up -d --build`. Crucially, CI never touches secrets: the SOPS age
# key lives only on the VPS (docs/deploy.md §3.1), so the box decrypts secrets.env itself. The
# runner holds one thing — an SSH key — and orchestrates; it never sees an application secret.
#
# One-time setup (Settings → Environments → "production" → add these secrets; add required
# reviewers there too for the approval gate):
#   DEPLOY_SSH_HOST        the VPS's ORIGIN IP — NOT vernfy.com. The Cloudflare proxy is on,
#                          so the apex resolves to Cloudflare's anycast addresses, which do not
#                          answer SSH. (The origin IP is deliberately absent from this repo:
#                          publishing it would undo the proxy's job of hiding the box.)
#   DEPLOY_SSH_USER        SSH user                 (e.g. root)
#   DEPLOY_SSH_KEY         private key with access to the box (PEM, the whole file). Use a
#                          deploy key generated for this workflow, not a human's personal key,
#                          so it can be revoked on its own.
#   DEPLOY_APP_DIR         path to the repo on the box (e.g. /root/finsight-platform)
#   DEPLOY_SSH_PORT        optional, default 22
#   DEPLOY_SSH_KNOWN_HOSTS optional; the box's SSH host key (`ssh-keyscan <origin-ip>`), to pin
#                          it instead of trust-on-first-use
#
# If any of these is missing the job fails with ssh's *usage* text and exit 255, not with a
# connection error: the destination collapses to "@", so ssh never gets a host to dial. Read
# that output as "a secret is unset", not as "the box is unreachable".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA the box should check out)"
        required: true
        default: main

concurrency:
  # Never let two deploys race onto the box.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH deploy + health gate
    runs-on: ubuntu-latest
    # Binds this job to the `production` Environment: configure required reviewers there to make
    # the deploy approval-gated, and scope the DEPLOY_* secrets to it.
    environment: production
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Two ways in, and DEPLOY_SSH_KEY_B64 is the one to use.
          #
          # A PEM pasted as text is one long multi-line secret, and every tool between the
          # clipboard and this runner gets an opinion about it: Windows turns the newlines into
          # CRLF, editors add a BOM, a partial selection drops the END line. OpenSSH answers all
          # of that with the same `Load key: error in libcrypto` — which reads like a corrupt key
          # and sends you looking at permissions instead of whitespace. Base64 has none of those
          # failure modes: one line, no spaces, byte-for-byte.
          #
          # The raw form still works (with the CRLF strip that made it survivable), so an existing
          # setup does not break the day this lands.
          if [ -n "${{ secrets.DEPLOY_SSH_KEY_B64 }}" ]; then
            # `|| true` so a malformed secret does NOT abort here under `set -o pipefail`: it
            # would exit with base64's own "invalid input" and skip the explanation below. One
            # bad secret, one error message, whichever way it is broken.
            printf '%s' "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | tr -d '\r\n' | base64 -d > ~/.ssh/id_deploy 2>/dev/null || true
          else
            printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          # Fail here rather than at connect time. Without this the job dies further down as
          # `error in libcrypto` + `Permission denied (publickey)`, which reads as "the server
          # rejected me" when in fact no key was ever loaded to be rejected. `-y` only derives the
          # public half; nothing secret reaches the log.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::The deploy key secret is not a readable private key. Set DEPLOY_SSH_KEY_B64 to the base64 of ~/.ssh/<key> (the file WITHOUT .pub). This is not a permissions or access problem." >&2
            exit 1
          fi
          PORT="${{ secrets.DEPLOY_SSH_PORT || '22' }}"
          if [ -n "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" ]; then
            # Same CRLF trap: a stray \r makes the pinned host key silently fail to match, and
            # the run falls back to trust-on-first-use while looking like it pinned nothing.
            printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          else
            # No pinned host key provided — trust on first use (accept-new).
            ssh-keyscan -p "$PORT" "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy + health gate over SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          # Everything below runs ON THE VPS. gitignored files (secrets.env, the age key, .env)
          # are untracked, so `git reset --hard` never disturbs them — it only fast-forwards the
          # tracked code to the chosen ref. The box then decrypts its own secrets via SOPS.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" \
              "APP_DIR='$APP_DIR' REF='$REF' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          echo "== deploying ref: $REF =="
          git fetch --all --prune
          git checkout "$REF"
          git reset --hard "origin/$REF" 2>/dev/null || git reset --hard "$REF"
          echo "== now at: $(git rev-parse --short HEAD) =="
          # The box's own SOPS wrapper injects secrets for the life of this one command. Serialize
          # the 9 image builds so the 8 GB box doesn't oversubscribe RAM (docs/deploy.md §8).
          COMPOSE_PARALLEL_LIMIT=1 scripts/prod-compose.sh up -d --build
          echo "== waiting for the gateway to report healthy =="
          for i in $(seq 1 30); do
            if scripts/prod-compose.sh exec -T api-gateway \
                 curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "gateway healthy after ~$((i*10))s"
              scripts/prod-compose.sh ps
              exit 0
            fi
            sleep 10
          done
          echo "gateway did NOT become healthy within ~5m after deploy" >&2
          scripts/prod-compose.sh ps
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
