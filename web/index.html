<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Installable web app. Named .json rather than .webmanifest on purpose: the nginx image that
      serves this (web/nginx.conf) has no mime.types entry for .webmanifest and would hand it over
      as application/octet-stream, while .json is mapped already.

      iOS is the reason this exists at all — Safari only delivers web push to a site that has been
      added to the home screen, so without a manifest the push channel is dead on every iPhone.
      `apple-mobile-web-app-capable` is the deprecated spelling, kept alongside the standard one
      because older iOS reads only that when deciding to launch standalone.
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Vernfy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!--
      Without these, a crawler has nothing to go on: the SPA ships an empty #root, so the only
      text on the page is the login form. Google was quoting "Sign in to Vernfy. Email Password
      Sign in." as the description, and AI summaries concluded the site was a generic login portal
      with no stated purpose. One static description covers every route — there is no per-route
      title, and adding SSR just for this would be a far larger change than the problem warrants.
    -->
    <meta
      name="description"
      content="Vernfy tracks your spending, budgets and wallets, then flags what looks wrong — clear, rule-based alerts and insights, never a black box."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vernfy" />
    <meta property="og:title" content="Vernfy — Financial Intelligence &amp; Risk Monitoring" />
    <meta
      property="og:description"
      content="Track spending, budgets and wallets in one place, and get told the moment something looks wrong."
    />
    <meta property="og:url" content="https://vernfy.com/" />
    <meta property="og:image" content="https://vernfy.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <title>Vernfy — Financial Intelligence &amp; Risk Monitoring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
