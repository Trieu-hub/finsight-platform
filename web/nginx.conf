server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html so React Router can
    # resolve them client-side (a hard refresh on /wallets must not 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets are immutable — cache them hard. One directive, not two: `expires 1y`
    # emits its own `Cache-Control: max-age=...` on top of the `add_header` below it, so the
    # response used to carry the header twice. Browsers merge them and behave correctly, but a
    # duplicated header is the kind of thing that reads as a bug during an incident, and any
    # future edit has to remember it lives in two places.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must never be cached. It has no fingerprint in its name, so it is
    # the ONE file that has to be re-fetched to ship any change — and with no Cache-Control
    # of our own, Cloudflare treats it as an ordinary .js asset and applies its default
    # 4-hour browser TTL (observed on prod: `cache-control: max-age=14400`,
    # `cf-cache-status: HIT`). A stale worker keeps serving its own stale asset cache, and
    # that failure looks like a blank page rather than an error.
    #
    # `no-cache` means "revalidate before use", not "do not store": the browser and the edge
    # still keep a copy, they just have to ask first.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    # Same reasoning as the worker above, for the same reason: index.html is the other file
    # whose name carries no content hash, so it is the one the browser must re-ask about to
    # ever see a new build. `immutable` would be exactly wrong here — it is right for
    # /assets/ precisely because those names DO change when their content does.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
