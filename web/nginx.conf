server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html so React Router can
    # resolve them client-side (a hard refresh on /wallets must not 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be cached. It has no fingerprint in its name, so it is
    # the ONE file that has to be re-fetched to ship any change — and with no Cache-Control
    # of our own, Cloudflare treats it as an ordinary .js asset and applies its default
    # 4-hour browser TTL (observed on prod: `cache-control: max-age=14400`,
    # `cf-cache-status: HIT`). A stale worker keeps serving its own stale asset cache, and
    # that failure looks like a blank page rather than an error.
    #
    # `no-cache` means "revalidate before use", not "do not store": the browser and the edge
    # still keep a copy, they just have to ask first.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
