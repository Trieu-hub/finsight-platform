# Alertmanager routing → Telegram (opt-in `monitoring` profile).
#
# Secrets are NOT baked in here. At container start the prod overlay's entrypoint:
#   1. writes $ALERTMANAGER_TELEGRAM_BOT_TOKEN (SOPS-injected) to /tmp/telegram_bot_token (tmpfs),
#   2. seds the real chat id in for __CHAT_ID__ into /tmp/alertmanager.yml (tmpfs),
#   3. runs alertmanager against that rendered copy.
# So the bot token never touches disk or git, and the chat id stays out of git too.
# `amtool check-config` validates the RENDERED file (real integer chat id) — __CHAT_ID__ is a
# placeholder, not a valid chat id on its own.
route:
  receiver: telegram
  # Collapse alerts that share these labels into one notification.
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: telegram
    telegram_configs:
      - send_resolved: true
        bot_token_file: /tmp/telegram_bot_token
        chat_id: __CHAT_ID__
        api_url: https://api.telegram.org
        parse_mode: HTML
        message: |
          {{ if eq .Status "firing" }}🔴 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} — {{ .Alerts | len }} alert(s) · FinSight
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b>{{ if .Labels.severity }} · {{ .Labels.severity }}{{ end }}{{ if .Labels.job }} · {{ .Labels.job }}{{ end }}
          {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ end }}{{ if .Annotations.description }}
          {{ .Annotations.description }}{{ end }}
          {{ end }}

# Silence a critical alert if it implies a warning is redundant (e.g. a down service will also
# trip its error-rate rule). Optional; kept minimal for the demo.
inhibit_rules:
  - source_matchers: ['severity = "critical"']
    target_matchers: ['severity = "warning"']
    equal: ['job']
