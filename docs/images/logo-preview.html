<!doctype html>
<meta charset="utf-8">
<title>Vernfy logo preview</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
  section { padding: 40px; }
  .dark  { background: #0a0a0a; color: #e5e5e5; }
  .light { background: #ffffff; color: #0f172a; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; opacity: .5; margin: 0 0 24px; }
  .row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; margin-bottom: 32px; }
  .sizes { display: flex; align-items: flex-end; gap: 24px; }
  .sizes figure { margin: 0; text-align: center; }
  .sizes figcaption { font-size: 11px; opacity: .5; margin-top: 8px; }
</style>

<section class="dark">
  <h2>Dark background — the app (#0a0a0a)</h2>
  <div class="row"><img src="vernfy-logo-dark.svg" height="64" alt=""></div>
  <div class="sizes">
    <figure><img src="vernfy-mark.svg" width="96"><figcaption>96</figcaption></figure>
    <figure><img src="vernfy-mark.svg" width="48"><figcaption>48</figcaption></figure>
    <figure><img src="vernfy-mark.svg" width="32"><figcaption>32</figcaption></figure>
    <figure><img src="vernfy-mark.svg" width="16"><figcaption>16 (favicon)</figcaption></figure>
  </div>
</section>

<section class="light">
  <h2>Light background — README, slides, print</h2>
  <div class="row"><img src="vernfy-logo-light.svg" height="64" alt=""></div>
  <div class="sizes">
    <figure><img src="vernfy-logo-light.svg" height="40"><figcaption>40</figcaption></figure>
    <figure><img src="vernfy-logo-light.svg" height="24"><figcaption>24 — legibility floor</figcaption></figure>
  </div>
</section>
