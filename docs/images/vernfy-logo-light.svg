          stroke-linejoin="round"/>
    <circle cx="51" cy="14" r="5.5" fill="#0D9488"/>
  </g>

  <!-- Live text — see the note in vernfy-logo-dark.svg about outlining before print. -->
  <text x="76" y="43"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
