<svg xmlns="http://www.w3.org/2000/svg" width="248" height="64" viewBox="0 0 248 64" role="img" aria-label="Vernfy">
  <title>Vernfy</title>
  <!-- Horizontal lockup for DARK backgrounds (the app's neutral-950 #0a0a0a). -->
  <defs>
    <linearGradient id="vernfy-stroke-d" x1="10" y1="46" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <g>
    <circle cx="51" cy="14" r="11" fill="#2DD4BF" opacity="0.16"/>
    <path d="M12 25 L27 44 L51 14"
          fill="none"
          stroke="url(#vernfy-stroke-d)"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="51" cy="14" r="5.5" fill="#5EEAD4"/>
  </g>

  <!--
    Wordmark rendered as live text, so it follows whatever sans the viewer has. That keeps the
    file editable, but means it is NOT pixel-identical across machines: outline it (Inkscape:
    Path > Object to Path) before using it anywhere the exact shapes matter, e.g. print or a
    submitted logo asset.
  -->
  <text x="76" y="43"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34"
        font-weight="600"
        letter-spacing="-0.8"
        fill="#E5E5E5">Vernfy</text>
</svg>
