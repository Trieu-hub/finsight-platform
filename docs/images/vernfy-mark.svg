<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Vernfy">
  <title>Vernfy</title>
  <!--
    One stroke, three readings: the letter V, a line chart that bottoms out and recovers,
    and a checkmark (Vernfy ~ verify). The ascending arm is longer than the descending one so
    the eye is left travelling upward. The node marks the latest data point.
    Colours are the app's own accents (emerald-500 -> teal-400 on neutral-950).
  -->
  <defs>
    <linearGradient id="vernfy-stroke" x1="10" y1="46" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- Soft halo behind the node. Invisible at favicon size, gives depth at large sizes. -->
  <circle cx="51" cy="14" r="11" fill="#2DD4BF" opacity="0.16"/>

  <path d="M12 25 L27 44 L51 14"
        fill="none"
        stroke="url(#vernfy-stroke)"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <circle cx="51" cy="14" r="5.5" fill="#5EEAD4"/>
</svg>
